name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: drocsid

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify code
        run: cargo check --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            architecture: x86_64
            extension: .exe
            archive_extension: zip

          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
            extension: ""
            archive_extension: tar.gz

          - name: macOS ARM64
            runner: macos-14
            target: aarch64-apple-darwin
            platform: macos
            architecture: arm64
            extension: ""
            archive_extension: tar.gz

          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x86_64
            extension: ""
            archive_extension: tar.gz

          - name: Linux ARM64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: arm64
            extension: ""
            archive_extension: tar.gz

          - name: Android ARM64 (Termux)
            runner: ubuntu-latest
            target: aarch64-linux-android
            platform: android
            architecture: arm64
            extension: ""
            archive_extension: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;26.3.11579264

      - name: Configure Android ARM64 linker
        if: matrix.target == 'aarch64-linux-android'
        run: echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ANDROID_HOME}/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --package drocsid --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
          BINARY_EXTENSION: ${{ matrix.extension }}
          ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          archive_name="${BINARY_NAME}-${VERSION}-${PLATFORM}-${ARCHITECTURE}"
          staging_directory="${RUNNER_TEMP}/${archive_name}"
          binary_path="target/${TARGET}/release/drocsid${BINARY_EXTENSION}"
          packaged_binary="${staging_directory}/${BINARY_NAME}${BINARY_EXTENSION}"

          mkdir -p "${staging_directory}"
          cp "${binary_path}" "${packaged_binary}"

          if [[ "${ARCHIVE_EXTENSION}" == "zip" ]]; then
            7z a "${RUNNER_TEMP}/${archive_name}.zip" "${packaged_binary}"
          else
            tar -czf "${RUNNER_TEMP}/${archive_name}.tar.gz" -C "${staging_directory}" "${BINARY_NAME}"
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/drocsid-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.architecture }}.${{ matrix.archive_extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag || github.ref_name }}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "drocsid ${{ inputs.tag || github.ref_name }}"
